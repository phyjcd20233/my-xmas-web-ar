<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Image Tracking - Christmas Village</title>

  <!-- 引入 A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- 引入 MindAR for A-Frame 專用函式庫 -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- 引入 3D 模型動畫控制器 -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 30px;
      z-index: 99;
    }
    .scan-guide {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- 掃描引導提示 UI -->
  <div id="scanner-overlay">
    <div class="scan-guide">🎁 請將手機鏡頭對準指定的聖誕圖片</div>
  </div>

  <!-- A-Scene 結合 MindAR 圖像追蹤 -->
  <!-- mindar-image: 讀取你上傳的 targets.mind 檔案 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; smooth: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <!-- 1. 資源預載 -->
    <a-assets>
      <!-- 你的聖誕小鎮 3D 模型檔 (.glb) -->
      <a-asset-item id="christmas-village" src="./assets/christmas_village.glb"></a-asset-item>
    </a-assets>

    <!-- 2. 環境光源 -->
    <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
    <a-entity light="type: directional; intensity: 1;" position="1 2 1"></a-entity>

    <!-- 3. 綁定目標圖片索引 (targetIndex="0" 代表對應 targets.mind 內的第 1 張圖片) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 4. 錨定在圖片上的 3D 聖誕小鎮動畫 -->
      <a-gltf-model 
        src="#christmas-village" 
        position="0 0 0" 
        scale="0.6 0.6 0.6" 
        rotation="0 0 0"
        animation-mixer>
      </a-gltf-model>

    </a-entity>

    <!-- 5. AR 專用相機 -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>
</body>
</html>
