<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Christmas Village - MTR 獎賞活動</title>

  <!-- 引入 A-Frame 與相關擴充 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 1. 開始按鈕畫面 */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1b4332, #081c15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      transition: opacity 0.5s ease;
    }
    #start-screen h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    #start-screen p {
      font-size: 14px;
      color: #adb5bd;
      margin-bottom: 30px;
    }
    #start-btn {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
    }

    /* 2. 掃描中引導介面 */
    #scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 30px;
      z-index: 99;
      display: none;
    }
    .scan-guide {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    /* 3. 掃描成功貼紙（點擊可進入下一頁） */
    #success-sticker {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(255, 255, 255, 0.95);
      color: #1b4332;
      padding: 14px 25px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: auto; /* 讓貼紙可以被點擊 */
      cursor: pointer;
    }
    #success-sticker.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    #success-sticker span {
      font-size: 20px;
    }

    /* 4. 下一頁：MTR 積分結果頁面 */
    #reward-page {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8f9fa;
      display: none; /* 預設隱藏，掃描成功後點擊貼紙顯示 */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      color: #212529;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
    }
    .reward-card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 100%;
    }
    .reward-card h2 {
      color: #e63946;
      font-size: 24px;
      margin-bottom: 15px;
    }
    .reward-card p {
      font-size: 16px;
      line-height: 1.6;
      color: #495057;
      margin-bottom: 25px;
    }
    .back-btn {
      background-color: #1b4332;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>

  <script>
    // 點擊開始按鈕
    function startAR() {
      document.getElementById('start-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('scanner-overlay').style.display = 'flex';
      }, 500);
    }

    // 點擊成功貼紙後，跳轉到獎賞結果頁面（下一頁）
    function goToRewardPage() {
      document.getElementById('reward-page').style.display = 'flex';
    }

    // 從獎賞頁面返回 AR 相機
    function backToAR() {
      document.getElementById('reward-page').style.display = 'none';
    }

    // 監聽 MindAR 識別事件
    document.addEventListener("DOMContentLoaded", function() {
      const targetEntity = document.querySelector('#ar-target');
      const scanGuide = document.getElementById('scan-text');
      const successSticker = document.getElementById('success-sticker');

      // 當成功對準圖片時
      targetEntity.addEventListener('targetFound', event => {
        scanGuide.innerText = "✨ 掃描成功！請點擊下方解鎖貼紙";
        scanGuide.style.background = "rgba(40, 167, 69, 0.8)";
        successSticker.classList.add('show'); // 顯示成功貼紙
      });

      // 當移開圖片時
      targetEntity.addEventListener('targetLost', event => {
        scanGuide.innerText = "🎁 請將手機鏡頭對準指定的聖誕圖片";
        scanGuide.style.background = "rgba(0, 0, 0, 0.7)";
      });
    });
  </script>
</head>

<body>

  <!-- 1. 開始按鈕畫面 -->
  <div id="start-screen">
    <h1>🎄 聖誕小鎮 WebAR 體驗</h1>
    <p>點擊下方按鈕啟動相機，掃描圖案領取 MTR 積分！</p>
    <button id="start-btn" onclick="startAR()">開始體驗</button>
  </div>

  <!-- 2. 掃描引導介面 -->
  <div id="scanner-overlay">
    <div id="scan-text" class="scan-guide">🎁 請將手機鏡頭對準指定的聖誕圖片</div>
  </div>

  <!-- 3. 掃描成功貼紙（點擊可進入下一頁） -->
  <div id="success-sticker" onclick="goToRewardPage()">
    <span>🎉</span> <span>點擊領取 10 MTR 積分！</span>
  </div>

  <!-- 4. 下一頁：MTR 積分結果頁面 -->
  <div id="reward-page">
    <div class="reward-card">
      <h2>🎉 成功獲得獎賞！</h2>
      <p>10 MTR分將於活動結束後七日內，存入得獎者的MTR Mobile賬戶</p>
      <button class="back-btn" onclick="backToAR()">返回 AR 畫面</button>
    </div>
  </div>

  <!-- A-Scene 結合 MindAR 圖像追蹤與高解析度相機設定 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; smooth: true; uiScanning: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights, highPerformance: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="christmas-village" src="./assets/christmas_village.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
    <a-entity light="type: directional; intensity: 1;" position="1 2 1"></a-entity>

    <!-- 綁定目標圖片與 3D 模型 -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        id="village-model"
        src="#christmas-village" 
        position="0 0 0" 
        scale="0.6 0.6 0.6" 
        rotation="0 0 0"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <!-- 高畫質相機 -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

</body>
</html>
