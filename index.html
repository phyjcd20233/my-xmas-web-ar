<!-- 綁定目標圖片與自製的 3D 聖誕樹特效 -->
<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
  
  <!-- 1. 綠色聖誕樹主體（圓錐體），並加上旋轉動畫 -->
  <a-cone 
    position="0 0.5 0" 
    radius-bottom="0.4" 
    height="0.8" 
    color="#2b9348"
    animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear;">
  </a-cone>

  <!-- 2. 樹頂的金色星星 -->
  <a-sphere 
    position="0 1 0" 
    radius="0.1" 
    color="#ffd166">
  </a-sphere>

  <!-- 3. 漂浮的雪球裝飾（會上下浮動） -->
  <a-sphere 
    position="0.3 0.2 0.3" 
    radius="0.08" 
    color="#ffffff"
    animation="property: position; to: 0.3 0.4 0.3; dir: alternate; dur: 1000; loop: true;">
  </a-sphere>

</a-entity>
