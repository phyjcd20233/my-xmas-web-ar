<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Christmas Village - 互動體驗</title>

  <!-- 引入 A-Frame 與相關擴充 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 1. 開始按鈕蓋板 (Splash Screen) */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1b4332, #081c15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      transition: opacity 0.5s ease;
    }
    #start-screen h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    #start-screen p {
      font-size: 14px;
      color: #adb5bd;
      margin-bottom: 30px;
    }
    #start-btn {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
    }

    /* 2 & 3. 掃描中引導介面 */
    #scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 30px;
      z-index: 99;
      display: none; /* 點擊開始後才顯示 */
    }
    .scan-guide {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    /* 4. 掃描成功 Sticker 貼紙 */
    #success-sticker {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(255, 255, 255, 0.95);
      color: #1b4332;
      padding: 12px 25px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    #success-sticker.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    #success-sticker span {
      font-size: 20px;
    }
  </style>

  <script>
    // 控制點擊「開始」按鈕後的邏輯
    function startAR() {
      // 隱藏開始畫面
      document.getElementById('start-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('scanner-overlay').style.display = 'flex';
      }, 500);
    }

    // 監聽 MindAR 識別事件
    document.addEventListener("DOMContentLoaded", function() {
      const targetEntity = document.querySelector('#ar-target');
      const scanGuide = document.getElementById('scan-text');
      const successSticker = document.getElementById('success-sticker');

      // 當鏡頭成功掃描並辨識到指定圖片時
      targetEntity.addEventListener('targetFound', event => {
        scanGuide.innerText = "✨ 掃描成功！聖誕小鎮已展開";
        scanGuide.style.background = "rgba(40, 167, 69, 0.8)";
        successSticker.classList.add('show'); // 顯示成功 Sticker
      });

      // 當鏡頭移開圖片時
      targetEntity.addEventListener('targetLost', event => {
        scanGuide.innerText = "🎁 請將手機鏡頭對準指定的聖誕圖片";
        scanGuide.style.background = "rgba(0, 0, 0, 0.7)";
        successSticker.classList.remove('show'); // 隱藏 Sticker
      });
    });
  </script>
</head>

<body>

  <!-- 1. 開始按鈕畫面 -->
  <div id="start-screen">
    <h1>🎄 聖誕小鎮 WebAR 體驗</h1>
    <p>點擊下方按鈕啟動相機，準備探索 AR 聖誕世界！</p>
    <button id="start-btn" onclick="startAR()">開始體驗</button>
  </div>

  <!-- 2 & 3. 掃描引導介面 -->
  <div id="scanner-overlay">
    <div id="scan-text" class="scan-guide">🎁 請將手機鏡頭對準指定的聖誕圖片</div>
  </div>

  <!-- 4. 掃瞄成功解鎖的 Sticker 貼紙 -->
  <div id="success-sticker">
    <span>🌟</span> <span>已解鎖：聖誕小鎮成就達成！</span>
  </div>

  <!-- A-Scene 結合 MindAR 圖像追蹤 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; smooth: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="christmas-village" src="./assets/christmas_village.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
    <a-entity light="type: directional; intensity: 1;" position="1 2 1"></a-entity>

    <!-- 綁定目標圖片與事件監聽 ID -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#christmas-village" 
        position="0 0 0" 
        scale="0.6 0.6 0.6" 
        rotation="0 0 0"
        animation-mixer>
      </a-gltf-model>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

</body>
</html>
