<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 聖誕小鎮 Christmas Village</title>

  <!-- 引入 A-Frame WebGL 框架 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- 引入 AR.js (支援相機透視與 3D 渲染) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- 引入 動畫控制器 (用於播放 3D 模型的內建動畫) -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    /* 載入提示 overlay */
    #ui-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- 畫面提示 -->
  <div id="ui-container">🎄 移動手機尋找平面，享受聖誕小鎮動畫！</div>

  <!-- A-Frame 3D / AR 場景設定 -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;">
    
    <!-- 1. 資源預載 (Assets Management) -->
    <a-assets>
      <!-- 請替換為你的 3D 聖誕小鎮 GLTF/GLB 檔案路徑 -->
      <a-asset-item id="christmas-village" src="./assets/christmas_village.glb"></a-asset-item>
    </a-assets>

    <!-- 2. 環境光線 (Lighting) -->
    <a-entity light="type: ambient; intensity: 1.2;"></a-entity>
    <a-entity light="type: directional; intensity: 0.8; castShadow: true;" position="-1 2 1"></a-entity>

    <!-- 3. 3D 聖誕小鎮實體 -->
    <!-- animation-mixer: 自動播放 glb 內的動畫效果 -->
    <a-entity 
      id="village-model"
      gltf-model="#christmas-village"
      position="0 0 -3" 
      scale="0.5 0.5 0.5"
      rotation="0 0 0"
      animation-mixer>
    </a-entity>

    <!-- 4. AR 相機 -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
